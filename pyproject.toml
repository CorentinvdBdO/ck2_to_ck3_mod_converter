[project]
name = "ck2-ck3-mod-converter"
version = "0.3.0"
description = "Convert a CK2 total-conversion mod into a CK3 mod (map, titles, history, characters, cultures, religions)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2",
    "gitpython",
    "numpy",
    "scipy>=1.15",
    "pillow",
]

[project.scripts]
ck2ck3 = "ck2ck3.cli:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ck2ck3"]

[tool.pytest.ini_options]
# `src` for the new `ck2ck3` package, `.` for the legacy `src.*` modules.
pythonpath = ["src", "."]
testpaths = ["tests"]
markers = ["slow: parses the whole Faerun mod; skipped when Faerun/ is absent"]
