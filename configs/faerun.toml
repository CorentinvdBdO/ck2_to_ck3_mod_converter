# Faerûn (Project Faerûn, CK2) → CK3 1.19. Reference config for `ck2ck3`.
# Key reference: docs/cli.md. Relative paths resolve against the repository root.

[mod]
name = "Faerun (CK2 conversion, raw)"
# Prefix for every generated identifier and filename (fae_*). `fk_` is the
# hand-written submod, see docs/PROJECT.md.
prefix = "fae"
version = "0.1.0"
supported_version = "1.19.*"
tags = ["Total Conversion", "Map", "Historical"]
# CK3 start date of the generated bookmark. Faerûn's own start is 1357 DR;
# open decision in docs/design_map.md §C.
bookmark_date = "1357.1.1"
# Vanilla folders the mod replaces rather than adds to. Seeded from Elder
# Kings 2 (a working CK3 total conversion, verified 2026-09-07); each lane adds
# the folders it takes over.
replace_paths = [
    "common/bookmark_portraits",
    "common/dna_data",
    "common/dynasties",
    "common/landed_titles",
    "common/province_terrain",
    # NOT replaced, and each removal is load-bearing (ck3-tiger, 2026-09-07):
    #   common/terrain_types        - province_terrain names vanilla terrain keys
    #   common/culture/cultures     - history/provinces names a vanilla culture
    #   common/culture/name_lists     (both until lane cultures-religions ships)
    #   common/religion/*           - history/provinces names a vanilla faith
    # Replacing them dropped the vanilla definitions and produced 2338 "terrain
    # not defined", 2336 "culture not defined" and 2335 "faith not defined"
    # errors. Each lane adds its folder back when it ships content for it.
    "gfx/interface/illustrations/loading_screens",
    "gfx/portraits/portrait_modifiers",
    # `replace_path` is NOT recursive: replacing "history" does nothing for
    # history/provinces (verified, ck3-tiger diagnostic: "replace_path only
    # replaces the specific directory, not any directories below it"), so every
    # subfolder is listed. docs/output_bootstrap.md §0.
    "history/characters",
    "history/cultures",
    "history/province_mapping",
    "history/provinces",
    "history/struggles",
    "history/titles",
    "history/wars",
    # map_data itself needs NO replace_path: same-filename override is enough,
    # which is the Elder Kings 2 / Godherja pattern. Its geographical_regions
    # subfolder does need one, since vanilla ships three files there that
    # reference vanilla duchies.
    "map_data/geographical_regions",
    # Mandatory for a total conversion: vanilla ships 18 tests/*.txt that
    # hard-code 1066 ids (character 122, k_croatia) and would fail en masse on
    # this map. Step `tests` owns the folder.
    "tests",
]

[paths]
# CK2 IS installed here (`verified` 2026-09-08: game/ and common/ present); a
# step that needs a vanilla CK2 file reads it from this path.
ck2_game = "/home/cvdbdo/.local/share/Steam/steamapps/common/Crusader Kings II"
# The CK2 mod being converted (gitignored clone, see CLAUDE.md).
ck2_mod = "Faerun/Faerun"
# CK3 game files, read-only reference for vanilla shapes.
ck3_game = "/home/cvdbdo/.local/share/Steam/steamapps/common/Crusader Kings III/game"
# The generated mod repository. Never hand-edited.
out = "/home/cvdbdo/git/paradox/ck3/claudespace/mods/faerun_ck2_to_ck3_converted"

# Physical map. Every number is measured; the derivation, the method and the
# evidence are in docs/map_scale.md. Lane `map-physical` owns this table.
[map]
# Legacy fields kept for anything that still reads them. They are DERIVED from
# [map.scale] below, not inputs: the canvas is planned from the CK2 source size
# and the scale factor, so these mirror the result.
dimensions = [8320, 6784]
scale = 1.9543095896
offset = [157, 140]
source_dimensions = [4096, 3328]

# true = write the text files only, skipping the four PNGs (30 s, ~45 MB).
skip_images = false

# CK2 labels its lakes only by the ocean_region comment text in default.map.
lake_names = ["Lakes"]

# --- measured scale inputs (flat keys: `scale` under [map] is already the
# --- derived float above, so a [map.scale] table would collide with it)
#
# km per pixel of each map. The factor is their ratio, so 10 km in Faerun spans
# the same number of pixels as 10 km in vanilla CK3.
#
# vanilla 1.4839: least-squares latitude fit over 16 core-Europe barony
# centroids (R^2 0.9962) x 111.19 km/deg. Deliberately NOT the whole-map figure
# of 1.7426: the CK3 sheet is not a uniform projection (latitude residuals span
# 653 px), and Europe is the density the game's barony and army scale was tuned
# against. scripts/measure_vanilla_scale.py.
vanilla_km_per_px = 1.4839
# Faerun 2.90 +/- 0.03: the Atlas of Ice and Fire 1371 DR guide map's own miles
# scale bar (123 px = 250 mi -> 3.2710 km/atlas-px) divided by the fitted
# atlas->CK2 similarity scale 1.1275 (rotation +0.000 deg, landmark RMS 1.93 px).
# The mod is drawn on the atlas projection. scripts/measure_faerun_scale.py.
source_km_per_px = 2.90
# Set to pin the factor and ignore the two numbers above (regression runs).
# The deleted convert.py used 5918/4096 = 1.4448242187, which implies 2.144
# km/px for Faerun - unmeasured, and 26% too small.
# factor_override = 1.4448242187
# 128, not 64: the coordinator's 2026-09-07 decision, together with
# provinces.crop_to_painted below. NOTE the crop is a no-op on Faerun (its
# painted extent IS the whole 4096x3328 bitmap; the 21% of unassigned white is
# interior ocean, not border), so the wider margin only grows the canvas from
# 8192x6656 to 8320x6784. docs/map_scale.md §7. Set back to 64 to undo.
sea_margin_px = 128
# Every shipping CK3 map is a multiple of 64 on both axes (vanilla 9216x4608,
# Elder Kings 2 8256x5504, Godherja 8192x4096). No define states it, so the
# requirement is `assumed`; obeying it costs at most 63 px of ocean.
canvas_multiple = 64
max_canvas_px = 32768

[map.heightmap]
# 1 = heightmap.png the same size as provinces.png. Both Elder Kings 2 and
# Godherja do this and declare original_heightmap_size equal to their provinces
# size; only vanilla uses 2 (a 122 MB PNG).
resolution_factor = 1
# CK2 topology.bmp value of the water surface. Measured, not the CK2 default of
# 95 taken on faith - though it turns out to be 95: Faerun's topology has a
# four-value dead band at 93-96 with zero pixels, water tops out at 92 and land
# starts at 97. scripts/measure_ck2_sea_level.py.
ck2_sea_level = 95
# CK3 16-bit water surface = WATERLEVEL / WORLD_EXTENTS_Y * 65535. We write
# WATERLEVEL 3.8 and WORLD_EXTENTS_Y 51 (the Elder Kings 2 and Godherja values)
# into common/defines, so 3.8 / 51 * 65535 = 4883 - exactly the value measured
# off both mods' coastlines. Vanilla's 3 / 50 gives 3932.
ck3_water_level = 4883
ck3_max_level = 49205  # vanilla's own heightmap maximum
# Extra (ck2_8bit, ck3_16bit) control points between the water level and the
# top. Empty = a straight line, which keeps relative altitudes honest.
curve = []
# Both reference total conversions use 33; vanilla uses 65.
tile_size = 33

# Barony subdivision: one CK3 province per CK2 holding built in
# history/provinces. Reference: docs/step_map_baronies.md.
[map.baronies]
# Left unset it follows [mod] bookmark_date. The set is the holdings built at
# this date UNION anything built by latest_bookmark, so a later bookmark still
# has provinces for its holdings (docs/design_map.md B.1).
# bookmark = "1357.1.1"
# Faerun's last bookmark in common/bookmarks/00_bookmarks.txt.
latest_bookmark = "1501.1.1"
# Smallest barony, in canvas pixels. 400 is the vanilla figure (a 20x20 blob at
# 9216x4608) and it needs no rescaling here: this canvas is at vanilla's own
# km per pixel by construction (docs/map_scale.md). Left unset, the code
# derives 326 from the width ratio, which is the wrong argument; pinned.
min_barony_pixels = 400
# Seed weights. 1.0 both, per docs/design_map.md B.3: the capital gets its
# position from CK2 positions.txt, which is enough of an advantage.
capital_weight = 1.0
other_weight = 1.0
# How much a terrain-biased pixel is favoured when a seed is sampled: a city
# seed prefers coast/river pixels, a castle seed hills/mountains, temples and
# tribes neither. 0.5 = a biased pixel counts as 1.5x as far from its
# neighbours as a plain one.
bias_gain = 0.5
# An imported seed coordinate (override, gazetteer, positions.txt) may be
# snapped this far onto its own county; further than this the row is ignored
# and the next seed source takes over, so a typo degrades instead of moving a
# barony into the wrong county.
snap_radius_px = 48
# Lloyd relaxation on the seeds the converter sampled itself: grow, move each
# sampled seed to its region centroid, regrow. Evens out the barony areas so
# fewer holdings are demoted; measured on Faerun, 0 passes demotes 313
# holdings, 2 demotes 176, 4 demotes 163 and 6 demotes 164 (converged).
# Override, gazetteer and positions.txt seeds are never moved.
relax_passes = 4
max_regrow_passes = 3
# Index into the 7 pairs of a CK2 positions.txt `position={...}` block. 0 is
# the city slot (verified, docs/map_scale.md 2b).
city_slot = 0
seeds_csv = "overrides/barony_seeds.csv"
gazetteer_csv = "overrides/gazetteer.csv"
# Per-duchy review PNGs during the conversion. Off: 979 sheets is ~3 min and
# ~40 MB, so it is a separate script (scripts/barony_review_sheets.py).
review_sheets = false

[map.provinces]
# A CK2 colour with fewer than this many target pixels is reported, and re-grown
# inside its own CK2 footprint if it can be.
min_pixels = 16
regrow_lost = true
# Scale only the bounding box of the pixels CK2 actually assigned to a
# province, so an unpainted source border never becomes padding ocean.
crop_to_painted = true
# Padding ocean, registered in definition.csv as a real sea province. Must not
# be black, white, or any CK2 province colour - the converter checks.
ocean_rgb = [0, 0, 96]
ocean_name = "Trackless Deep"

[map.terrain]
default = "plains"
# Faerun derives forest from trees.bmp, not terrain.bmp (whose forest index has
# zero pixels). Left empty to read the `tree` list from the CK2 default.map,
# which is { 3 4 7 10 }.
tree_indices = []

# CK2 terrain category -> CK3 1.19 terrain key. The per-line rationale is in
# src/ck2ck3/map/terrain.py; the entries with no real CK3 counterpart are
# counted in the run report rather than passed off as faithful.
[map.terrain.map]
plains = "plains"
farmlands = "farmlands"
coastal = "farmlands"           # shares farmlands' colour in CK2
forest = "forest"
woods = "forest"                # CK3 has one forest tier
hills = "hills"
mountain = "mountains"
impassable_mountains = "mountains"
steppe = "steppe"
desert = "desert"
coastal_desert = "drylands"
jungle = "jungle"
marsh = "wetlands"
arctic = "taiga"                # NO EQUIVALENT: no arctic key in CK3
glacier = "taiga"               # NO EQUIVALENT: no glacier key in CK3
subterranean = "mountains"      # NO EQUIVALENT: the Underdark
pti = "plains"
ocean = "sea"
inland_ocean = "coastal_sea"

# Localisation port (step `loc`, docs/formats_loc.md + docs/loc_codes.md).
[loc]
# Omit to auto-pick: english plus every column filled on at least min_share of
# the rows. Faerûn fills english 100 % and french/german/spanish 70.1 % each.
languages = ["english", "french", "german", "spanish"]
min_share = 0.05
# Optional `ck2_key,ck3_key` rename table, applied after everything else, so a
# later lane can rename an id and still resolve the CK2 text.
# `ck2_key,ck3_key[,mode]`; `mode` is `rename` (default, the source key is
# gone) or `copy` (the source key is emitted too, for `<title>_adj` and the
# religion `_plural` shapes). Regenerate with scripts/build_loc_key_map.py,
# which concatenates every mappings/loc_key_renames_*.csv.
key_map = "overrides/loc_keys.csv"
# 827 Faerûn keys shadow a vanilla CK3 string (mostly CK2 interface strings).
# Keeping them is deliberate: a total conversion replaces the interface too.
skip_vanilla_collisions = false
vanilla_keys = "docs/evidence/ck3_vanilla_loc_keys.txt"
# "custom": a `[X.GetFoo]` that is no CK2 engine built-in becomes
# `Custom('GetFoo')` (that is what it is in CK2) and is warned about.
# "marker": leave a visible <!CK2:...!> instead. See docs/loc_codes.md.
unknown_codes = "custom"

# Scripted tests written into the mod by step `tests`, asserting the generated
# mod's own claims. Grammar and how the game runs them:
# ../claudespace/docs/ck3_test_framework.md.
[tests]
# History title holders and land provinces to assert, spread evenly over the
# id range. 0 = every one, which is 3694 provinces and would make a test run
# minutes long for no extra signal.
sample = 50
# Bookmark key to anchor the assertions to. Unset = the highest-weight
# bookmark, which is the one the game's `-test` argument starts.
# bookmark = "bm_fae_1357_1_1"
